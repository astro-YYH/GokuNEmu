[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "GokuNEmu"  # must be unique on PyPI
version = "0.1.11"
description = "10D emulator for the nonlinear matter power spectrum built on Goku simulations"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Yanhui Yang", email = "yyang440@ucr.edu" }
]
dependencies = [
    "torch",
    "numpy"
]
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["gokunemu"]

[tool.setuptools.package-data]
gokunemu = ["models/W_*/best_model.pth", "models/N_*/best_model.pth", "input_limits-*.txt", "pplusf_0195.npy"]
